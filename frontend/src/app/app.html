<header>
  <h1>Pronóstico de demanda y reposición</h1>
  <nav aria-label="Principal">
    <a routerLink="/cargas" routerLinkActive="active">Cargas de datos</a>
    <a routerLink="/pronosticos" routerLinkActive="active">Pronósticos</a>
    <a routerLink="/recomendaciones" routerLinkActive="active">Recomendaciones</a>
    <a routerLink="/sistema" routerLinkActive="active">Estado del sistema</a>
  </nav>
  <label>
    Escenario mock:
    <select (change)="setScenario($event)" aria-label="Escenario mock">
      @for (s of scenarios; track s.id) {
        <option [value]="s.id" [selected]="s.id === ds.scenario()">{{ s.label }}</option>
      }
    </select>
  </label>
</header>
<main><router-outlet /></main>
