<a class="skip-link" href="#contenido">Saltar al contenido</a>
@if (demo.enabled) {
  <app-demo-banner />
}
<header>
  <h1>Pronóstico de demanda y reposición</h1>
  @if (auth.session(); as s) {
    <nav aria-label="Principal">
      <a routerLink="/resumen" routerLinkActive="active">Resumen</a>
      <a routerLink="/cargas" routerLinkActive="active">Importaciones</a>
      <a routerLink="/corridas" routerLinkActive="active">Corridas</a>
      <a routerLink="/pronosticos" queryParamsHandling="preserve" routerLinkActive="active">Pronósticos</a>
      <a routerLink="/recomendaciones" queryParamsHandling="preserve" routerLinkActive="active">Recomendaciones</a>
      <a routerLink="/comparacion" queryParamsHandling="preserve" routerLinkActive="active">Comparación</a>
      <a routerLink="/sistema" routerLinkActive="active">Sistema</a>
    </nav>
    <span class="user" data-testid="user">{{ s.username }} ({{ s.role }})</span>
    <button type="button" data-testid="logout" (click)="logout()">Salir</button>
  }
</header>
<main id="contenido" tabindex="-1"><router-outlet /></main>
